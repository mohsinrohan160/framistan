<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framistan — Campaign</title>
<style>
  body {margin:0; font-family:Inter, sans-serif; background:#0f172a; color:#e6eef8; display:flex; justify-content:center; padding:20px;}
  .container {max-width:600px; width:100%;}
  h1 {font-size:20px; margin-bottom:12px;}
  .frame-container {position:relative; width:100%; padding-top:100%; background:#0b1220; overflow:hidden; border-radius:12px;}
  .frame-container img, .frame-container canvas {position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain;}
  #userImage {cursor:move; touch-action:none;}
  .controls {margin-top:12px; display:flex; gap:8px;}
  button {padding:10px 14px; border:none; border-radius:10px; background:#06b6d4; color:#012; cursor:pointer; font-weight:600;}
</style>
</head>
<body>
<div class="container">
  <h1 id="campaignTitle">Campaign</h1>
  <div class="frame-container" id="frameContainer">
    <img id="frameImage" src="" alt="Frame">
  </div>

  <div class="controls">
    <input type="file" id="uploadPhoto" accept="image/*">
    <button id="mergeBtn">Merge & Download</button>
    <button id="resetBtn">Create New Photo</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBaAacwOXs_AUGv_P-D0h_aBMbkiocD-qc",
  authDomain: "framistan-pk.firebaseapp.com",
  databaseURL: "https://framistan-pk-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "framistan-pk",
  storageBucket: "framistan-pk.firebasestorage.app",
  messagingSenderId: "704624973815",
  appId: "1:704624973815:web:bbf6616108e5ed6ca940f2"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const slug = params.get('id');

const frameImage = document.getElementById('frameImage');
const frameContainer = document.getElementById('frameContainer');
const campaignTitle = document.getElementById('campaignTitle');
const uploadPhoto = document.getElementById('uploadPhoto');
const mergeBtn = document.getElementById('mergeBtn');
const resetBtn = document.getElementById('resetBtn');

let userImg = null, userImgData = null;

// Load campaign from Firebase
if(slug){
  const dbRef = ref(db);
  get(child(dbRef, 'campaigns/' + slug)).then(snapshot=>{
    if(snapshot.exists()){
      const data = snapshot.val();
      campaignTitle.textContent = data.name;
      frameImage.src = data.frame;
    } else { alert('Campaign not found'); }
  }).catch(err=>console.error(err));
}

// Interact.js
import interact from "https://cdn.jsdelivr.net/npm/@interactjs/interactjs/index.min.js";

// Create draggable & resizable image
function makeDraggable(el){
  interact(el)
    .draggable({
      inertia: true,
      modifiers: [
        interact.modifiers.restrictRect({restriction: frameContainer})
      ],
      listeners: {move: dragMoveListener}
    })
    .resizable({
      edges: { left:true, right:true, bottom:true, top:true },
      inertia:true,
      modifiers:[
        interact.modifiers.restrictEdges({outer: frameContainer})
      ],
      listeners:{move: resizeMoveListener}
    });
}

function dragMoveListener(event){
  const target = event.target;
  const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
  const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
  target.style.transform = `translate(${x}px,${y}px) scale(${target.getAttribute('data-scale')||1})`;
  target.setAttribute('data-x', x);
  target.setAttribute('data-y', y);
}

function resizeMoveListener(event){
  const target = event.target;
  let scale = (parseFloat(target.getAttribute('data-scale')) || 1);
  const dx = event.deltaRect.width / target.offsetWidth;
  scale = scale + dx;
  target.style.transform = `translate(${target.getAttribute('data-x')||0}px,${target.getAttribute('data-y')||0}px) scale(${scale})`;
  target.setAttribute('data-scale', scale);
}

// Handle upload
uploadPhoto.addEventListener('change', ()=>{
  const file = uploadPhoto.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=> {
    if(userImg){ userImg.remove(); userImg = null; }
    userImgData = reader.result;
    userImg = document.createElement('img');
    userImg.src = userImgData;
    userImg.id = 'userImage';
    userImg.style.position='absolute';
    userImg.style.top='0'; userImg.style.left='0';
    userImg.style.width='100%';
    userImg.style.height='100%';
    userImg.style.objectFit='contain';
    userImg.setAttribute('data-x',0);
    userImg.setAttribute('data-y',0);
    userImg.setAttribute('data-scale',1);
    frameContainer.appendChild(userImg);
    makeDraggable(userImg);
  }
  reader.readAsDataURL(file);
});

// Merge & Download
mergeBtn.addEventListener('click', ()=>{
  if(!userImgData){ alert('Upload your photo first'); return; }
  const canvas = document.createElement('canvas');
  const size = frameContainer.offsetWidth;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Draw user image
  const img = new Image();
  img.src = userImgData;
  img.onload = ()=>{
    const x = parseFloat(userImg.getAttribute('data-x'))||0;
    const y = parseFloat(userImg.getAttribute('data-y'))||0;
    const scale = parseFloat(userImg.getAttribute('data-scale'))||1;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, size, size);
    ctx.restore();

    // Draw frame
    const frameImgEl = new Image();
    frameImgEl.src = frameImage.src;
    frameImgEl.onload = ()=>{
      ctx.drawImage(frameImgEl,0,0,size,size);
      const merged = canvas.toDataURL('image/jpeg',0.95);
      const a = document.createElement('a');
      a.href = merged; a.download = 'framistan.jpg';
      a.click();
    }
  }
});

// Reset
resetBtn.addEventListener('click', ()=>{
  if(userImg){ userImg.remove(); userImg = null; }
  uploadPhoto.value='';
});
</script>
</body>
</html>
