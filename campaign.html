<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framistan — Campaign</title>
<style>
  body {margin:0; font-family:Inter, sans-serif; background:#0f172a; color:#e6eef8; display:flex; justify-content:center; padding:20px;}
  .container {max-width:600px; width:100%; text-align:center;}
  h1 {font-size:20px; margin-bottom:12px;}
  .frame-container {position:relative; width:100%; padding-top:100%; background:#0b1220; overflow:hidden; border-radius:12px; margin-bottom:12px;}
  .frame-container img {position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain;}
  #userImage {position:absolute; top:0; left:0; cursor:move; z-index:1;}
  #frameImage {z-index:2;}
  .btn {padding:12px 18px; border:none; border-radius:12px; background:#06b6d4; color:#012; font-weight:600; cursor:pointer; font-size:16px; transition:0.2s; margin:6px;}
  .btn:hover {background:#0dd6f5;}
</style>
</head>
<body>
<div class="container">
  <h1 id="campaignTitle">Campaign</h1>
  <div class="frame-container" id="frameContainer">
    <img id="frameImage" src="" alt="Frame">
  </div>

  <div>
    <label class="btn" for="uploadPhoto">Add Your Photo</label>
    <input type="file" id="uploadPhoto" accept="image/*" style="display:none;">
    <button id="doneBtn" class="btn" style="display:none;">Done</button>
    <button id="downloadBtn" class="btn" style="display:none;">Download</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
import interact from "https://cdn.jsdelivr.net/npm/@interactjs/interactjs/index.min.js";

const firebaseConfig = {
  apiKey: "AIzaSyBaAacwOXs_AUGv_P-D0h_aBMbkiocD-qc",
  authDomain: "framistan-pk.firebaseapp.com",
  databaseURL: "https://framistan-pk-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "framistan-pk",
  storageBucket: "framistan-pk.firebasestorage.app",
  messagingSenderId: "704624973815",
  appId: "1:704624973815:web:bbf6616108e5ed6ca940f2"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const slug = params.get('id');

const frameImage = document.getElementById('frameImage');
const frameContainer = document.getElementById('frameContainer');
const campaignTitle = document.getElementById('campaignTitle');
const uploadPhoto = document.getElementById('uploadPhoto');
const doneBtn = document.getElementById('doneBtn');
const downloadBtn = document.getElementById('downloadBtn');

let userImg = null;
let userState = { x:0, y:0, width:0, height:0 };

// Load campaign from Firebase
if(slug){
  const dbRef = ref(db);
  get(child(dbRef, 'campaigns/' + slug)).then(snapshot=>{
    if(snapshot.exists()){
      const data = snapshot.val();
      campaignTitle.textContent = data.name;
      frameImage.src = data.frame;
    } else { alert('Campaign not found'); }
  }).catch(err=>console.error(err));
}

// Handle photo upload
uploadPhoto.addEventListener('change', ()=>{
  const file = uploadPhoto.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    if(userImg) userImg.remove();
    userImg = document.createElement('img');
    userImg.src = reader.result;
    userImg.id = 'userImage';
    userImg.style.zIndex = 1;
    userImg.style.top='0px';
    userImg.style.left='0px';
    userImg.style.width='100%';
    userImg.style.height='100%';
    frameContainer.appendChild(userImg);
    doneBtn.style.display='inline-block';
    downloadBtn.style.display='none';
    initInteract();
  }
  reader.readAsDataURL(file);
});

// Draggable and resizable using Interact.js
function initInteract(){
  interact(userImg)
    .draggable({
      inertia:true,
      modifiers: [interact.modifiers.restrictRect({restriction: frameContainer})],
      listeners:{ move(event){
        const x = (parseFloat(userImg.dataset.x)||0) + event.dx;
        const y = (parseFloat(userImg.dataset.y)||0) + event.dy;
        userImg.style.left = x + 'px';
        userImg.style.top = y + 'px';
        userImg.dataset.x = x;
        userImg.dataset.y = y;
      }}
    })
    .resizable({
      edges:{left:true,right:true,top:true,bottom:true},
      inertia:true,
      preserveAspectRatio:true,
      modifiers:[interact.modifiers.restrictEdges({outer:frameContainer})],
      listeners:{ move(event){
        let w = event.rect.width;
        let h = event.rect.height;
        userImg.style.width = w + 'px';
        userImg.style.height = h + 'px';
        const x = (parseFloat(userImg.dataset.x)||0) + event.deltaRect.left;
        const y = (parseFloat(userImg.dataset.y)||0) + event.deltaRect.top;
        userImg.style.left = x + 'px';
        userImg.style.top = y + 'px';
        userImg.dataset.x = x;
        userImg.dataset.y = y;
      }}
    });
}

// Done button merges user photo with frame
doneBtn.addEventListener('click', ()=>{
  const canvas = document.createElement('canvas');
  const size = frameContainer.offsetWidth;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Draw user photo behind frame
  const uImg = new Image();
  uImg.src = userImg.src;
  uImg.onload = ()=>{
    ctx.drawImage(uImg,
      parseFloat(userImg.dataset.x)||0,
      parseFloat(userImg.dataset.y)||0,
      userImg.offsetWidth,
      userImg.offsetHeight
    );

    // Draw frame on top
    const fImg = new Image();
    fImg.src = frameImage.src;
    fImg.onload = ()=>{
      ctx.drawImage(fImg,0,0,size,size);
      // Show merged result
      frameContainer.innerHTML = '';
      const merged = new Image();
      merged.src = canvas.toDataURL('image/jpeg',0.95);
      merged.style.width='100%';
      frameContainer.appendChild(merged);

      downloadBtn.style.display='inline-block';
      downloadBtn.onclick = ()=>{
        const a = document.createElement('a');
        a.href = merged.src;
        a.download = 'framistan.jpg';
        a.click();
      }
    }
  }
});
</script>
</body>
</html>
