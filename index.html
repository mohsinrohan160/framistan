<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Framistan — Admin Page</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    :root{--bg:#0f172a;--card:#0b1220;--accent:#06b6d4;--muted:#94a3b8;--glass:rgba(255,255,255,0.04);--radius:12px;--shadow:0 6px 18px rgba(2,6,23,0.6);}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Inter, sans-serif; background:var(--bg); color:#e6eef8; min-height:100vh; padding:32px; display:flex; justify-content:center;}
    .container{width:100%; max-width:600px;}
    h1{margin-bottom:10px;}
    input, button{width:100%; padding:10px 12px; border-radius:10px; border:none; margin-top:10px;}
    button{background:var(--accent); color:#012; font-weight:600; cursor:pointer;}
    input[readonly]{background:var(--glass);}
    .muted{color:var(--muted); font-size:13px;}
    .link-box{display:none; margin-top:18px;}
  </style>
</head>
<body>
  <div class="container">
    <h1>Create a New Campaign</h1>
    <p class="muted">Upload a PNG frame and give your campaign a name. Share the link with users.</p>

    <input type="text" id="campaignName" placeholder="Campaign name e.g. Support Local School" required>
    <input type="file" id="frameFile" accept="image/png" required>
    <button id="createBtn">Create Campaign</button>

    <div class="link-box" id="linkBox">
      <label class="muted">Campaign Link:</label>
      <input type="text" id="campaignLink" readonly>
      <button id="copyLinkBtn">Copy Link</button>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBaAacwOXs_AUGv_P-D0h_aBMbkiocD-qc",
      authDomain: "framistan-pk.firebaseapp.com",
      databaseURL: "https://framistan-pk-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "framistan-pk",
      storageBucket: "framistan-pk.firebasestorage.app",
      messagingSenderId: "704624973815",
      appId: "1:704624973815:web:bbf6616108e5ed6ca940f2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const campaignNameInput = document.getElementById('campaignName');
    const frameFile = document.getElementById('frameFile');
    const createBtn = document.getElementById('createBtn');
    const linkBox = document.getElementById('linkBox');
    const campaignLink = document.getElementById('campaignLink');
    const copyLinkBtn = document.getElementById('copyLinkBtn');

    let frameBase64 = '';

    // Read PNG frame as Base64
    frameFile.addEventListener('change', ()=>{
      const file = frameFile.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=> frameBase64 = reader.result;
      reader.readAsDataURL(file);
    });

    // Convert name to URL-friendly slug
    function slugify(text){
      return text.toString().toLowerCase().trim()
        .replace(/\s+/g,'-')
        .replace(/[^\w\-]+/g,'')
        .replace(/\-\-+/g,'-');
    }

    createBtn.addEventListener('click', ()=>{
      const name = campaignNameInput.value.trim();
      if(!name){ alert('Enter campaign name'); return; }
      if(!frameBase64){ alert('Upload PNG frame'); return; }

      const id = slugify(name); // use campaign-name slug as ID

      set(ref(db,'campaigns/'+id), { name, frame: frameBase64 })
        .then(()=>{
          const link = `${window.location.origin}/campaign.html?id=${id}`;
          campaignLink.value = link;
          linkBox.style.display='block';
        })
        .catch(err=>alert('Error saving campaign: '+err));
    });

    copyLinkBtn.addEventListener('click', ()=>{
      campaignLink.select();
      document.execCommand('copy');
      copyLinkBtn.textContent='Copied!';
      setTimeout(()=>copyLinkBtn.textContent='Copy Link',1500);
    });
  </script>
</body>
</html>
